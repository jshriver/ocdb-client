name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Creates the GitHub Release for this tag first. upload-rust-binary-action
  # (used below) does NOT create releases itself -- it only uploads assets
  # to a release that already exists, so this step has to run first.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release
        uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl     # linux-x86-64 (static, no glibc dependency)
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl     # linux-armv8 (static, no glibc dependency)
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc        # windows-x86-64
            os: windows-latest
          - target: aarch64-apple-darwin          # apple-silicon
            os: macos-latest
          - target: x86_64-apple-darwin           # apple-x86-64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and upload binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ocdb-client
          target: ${{ matrix.target }}
          archive: ocdb-client-$target
          token: ${{ secrets.GITHUB_TOKEN }}