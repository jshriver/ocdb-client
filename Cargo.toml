[package]
name    = "ocdb-client"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "ocdb-client"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
ureq       = { version = "2", features = ["json"] }
uuid       = { version = "1",  features = ["v4"] }
sysinfo    = "0.30"
ctrlc      = "3"
shakmaty = "0.30.1"