[package]
name    = "ocdb-client"
version = "2.1.0"
edition = "2024"

[[bin]]
name = "ocdb-client"
path = "src/main.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
ureq       = { version = "2", features = ["json"] }
sysinfo    = "0.30"
ctrlc      = "3"
shakmaty   = "0.30.1"
raw-cpuid  = "11"
indicatif  = "0.18.6"
tar        = "0.4"
zip        = { version = "8.6.0", default-features = false, features = ["deflate"] }